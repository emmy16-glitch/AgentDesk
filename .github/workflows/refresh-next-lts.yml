name: Inspect remaining dependency advisories

on:
  push:
    branches: [security/next-lts-hardening]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full audit detail
        run: npm audit || true

      - name: Runtime-only audit detail
        run: npm audit --omit=dev || true
