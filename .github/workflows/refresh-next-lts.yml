name: Refresh Next.js LTS dependencies

on:
  push:
    branches: [security/next-lts-hardening]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: security/next-lts-hardening

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Upgrade maintained Next.js line
        run: npm install --save-exact next@15.5.24 eslint-config-next@15.5.24

      - name: Report npm audit counts
        shell: bash
        run: |
          npm audit --json > /tmp/audit.json || true
          node -e 'const a=require("/tmp/audit.json"); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2));'

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: upgrade Next.js to patched maintenance LTS"
          git push origin HEAD:security/next-lts-hardening
