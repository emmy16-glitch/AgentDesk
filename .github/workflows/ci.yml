name: AgentDesk CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agentdesk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Compile marketplace contract
        run: npm run contract:compile

      - name: Production build
        run: npm run build

      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/agentdesk-next.log 2>&1 &
          echo $! > /tmp/agentdesk-next.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/agentdesk-next.log
          exit 1

      - name: Production liveness and proof-boundary smoke
        run: npm run test:production-smoke

      - name: Live Phase 2 audition gate
        if: github.event_name == 'pull_request' && github.head_ref == 'phase2/live-agent-auditions'
        run: node scripts/live-audition-smoke.mjs

      - name: Source-backed browser QA
        run: npm run test:ui

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/agentdesk-next.log || true
