name: Record AgentDesk demo

on:
  push:
    branches: [demo-recording]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare isolated recorder
        run: |
          rm -rf /tmp/agentdesk-recorder
          mkdir -p /tmp/agentdesk-recorder
          cd /tmp/agentdesk-recorder
          npm init -y
          npm install --save-exact playwright@1.63.0
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Record live AgentDesk flow
        env:
          DEMO_URL: https://agentdesk-bnb-eight.vercel.app/
          OUTPUT_DIR: ${{ github.workspace }}/demo-artifacts
        run: |
          mkdir -p "$OUTPUT_DIR"
          cat > /tmp/agentdesk-recorder/record-demo.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const outDir = process.env.OUTPUT_DIR;
          fs.mkdirSync(outDir, { recursive: true });
          const log = (...parts) => {
            const line = parts.map(String).join(' ');
            console.log(line);
            fs.appendFileSync(path.join(outDir, 'recorder.log'), `${line}\n`);
          };

          let browser;
          let context;
          let page;
          let outcome = 'unknown';
          let bodyText = '';

          const pause = ms => page.waitForTimeout(ms);
          const shot = async name => {
            try { await page.screenshot({ path: path.join(outDir, `${name}.png`), fullPage: false }); }
            catch (error) { log('Screenshot failed:', name, error?.message || error); }
          };
          const clickAny = async labels => {
            for (const label of labels) {
              const re = new RegExp(label, 'i');
              for (const locator of [
                page.getByRole('button', { name: re }),
                page.getByRole('link', { name: re }),
                page.getByText(re).first(),
              ]) {
                try {
                  if (await locator.isVisible({ timeout: 1000 })) {
                    await locator.click({ timeout: 10000 });
                    log('Clicked:', label);
                    return true;
                  }
                } catch {}
              }
            }
            log('No clickable match for:', labels.join(' | '));
            return false;
          };

          try {
            browser = await chromium.launch({ headless: true });
            context = await browser.newContext({
              viewport: { width: 1440, height: 900 },
              recordVideo: { dir: outDir, size: { width: 1440, height: 900 } },
            });
            page = await context.newPage();
            page.on('console', msg => log('browser:', msg.type(), msg.text()));
            page.on('pageerror', error => log('pageerror:', error.message));

            log('Opening live production:', process.env.DEMO_URL);
            await page.goto(process.env.DEMO_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await pause(3500);
            log('Loaded:', await page.title());
            await shot('01-home');

            let input = null;
            for (const candidate of [
              page.locator('#agent-task'),
              page.getByRole('textbox').first(),
              page.locator('textarea').first(),
              page.locator('input[type="text"]').first(),
            ]) {
              try {
                if (await candidate.isVisible({ timeout: 1000 })) { input = candidate; break; }
              } catch {}
            }
            if (!input) throw new Error('Could not find task input');

            await input.click();
            await input.fill('Find a low-risk yield option for 500 USDC');
            await pause(1500);
            await shot('02-task-entered');

            if (!await clickAny(['Find & test agents', 'Find and test agents'])) {
              await input.press('Enter').catch(() => {});
            }
            await pause(2600);
            await shot('03-details');

            const started = await clickAny(['Find live agents', 'Start test', 'Test agents', 'Run test']);
            if (!started) throw new Error('Could not start the live agent test from Details');
            await pause(1800);
            await shot('04-test-started');

            const signals = [
              /BEST LIVE RESULT/i,
              /LIVE CAPABILITY MATCH/i,
              /Task completed/i,
              /Capability confirmed/i,
              /couldn.?t get enough live evidence/i,
              /No compatible/i,
              /Live audition failed/i,
            ];

            let detected = false;
            for (let i = 0; i < 48; i++) {
              for (const re of signals) {
                try {
                  if (await page.getByText(re).first().isVisible({ timeout: 200 })) {
                    detected = true;
                    log('Detected result signal:', re.toString());
                    break;
                  }
                } catch {}
              }
              if (detected) break;
              await pause(2500);
            }

            await pause(3000);
            await shot('05-result');
            bodyText = await page.locator('body').innerText().catch(() => '');

            if (/BEST LIVE RESULT/i.test(bodyText)) outcome = 'task-result';
            else if (/LIVE CAPABILITY MATCH/i.test(bodyText)) outcome = 'capability-offer';
            else if (/couldn.?t get enough live evidence|No compatible|Live audition failed/i.test(bodyText)) outcome = 'live-failure';
            else outcome = 'result-state-unclear';
            log('Outcome:', outcome);

            if (outcome === 'task-result') {
              if (await clickAny(['Check answer'])) {
                await pause(3500);
                await shot('06-check');
                if (await clickAny(['Continue to hire', 'Hire'])) {
                  await pause(3000);
                  await shot('07-hire');
                }
              }
            } else if (outcome === 'capability-offer') {
              if (await clickAny(['Continue to hire', 'Hire'])) {
                await pause(3000);
                await shot('06-hire');
              }
            }
          } catch (error) {
            outcome = 'recorder-error';
            log('Recorder error:', error?.stack || error);
            if (page) await shot('error');
          } finally {
            fs.writeFileSync(path.join(outDir, 'outcome.txt'), `${outcome}\n`);
            if (bodyText) fs.writeFileSync(path.join(outDir, 'page.txt'), bodyText.slice(0, 30000));
            if (context) await context.close().catch(() => {});
            if (browser) await browser.close().catch(() => {});
          }
          EOF
          cd /tmp/agentdesk-recorder
          node record-demo.mjs

      - name: Convert recording to MP4
        if: always()
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          VIDEO=$(find demo-artifacts -maxdepth 1 -type f -name '*.webm' | head -n 1 || true)
          if [ -n "$VIDEO" ]; then
            ffmpeg -y -i "$VIDEO" -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -movflags +faststart demo-artifacts/agentdesk-demo.mp4
          fi
          echo "Artifacts:"
          ls -lah demo-artifacts
          echo "Outcome:"
          cat demo-artifacts/outcome.txt || true

      - name: Upload demo artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentdesk-demo-recording
          path: demo-artifacts/
          if-no-files-found: error
          retention-days: 7
